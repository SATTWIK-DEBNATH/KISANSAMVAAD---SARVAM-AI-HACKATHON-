<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - KisanSamvaad Sovereign Agri AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#F0FDF4', 100: '#DCFCE7', 500: '#22C55E', 600: '#16A34A', 700: '#15803D' },
            tech: '#2563EB'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-100 via-emerald-50/40 to-slate-100 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-slate-200/80 p-8 sm:p-10 relative overflow-hidden">
    <!-- Accent Top Bar -->
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-emerald-500 via-teal-500 to-blue-500"></div>

    <!-- Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-600 text-white font-extrabold text-2xl shadow-lg shadow-emerald-600/20 mb-4 hover:scale-105 transition transform">
        🌾
      </a>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">KisanSamvaad</h1>
      <p class="text-xs font-semibold text-emerald-700 uppercase tracking-widest mt-1">Sovereign Indic Voice &amp; Vision Portal</p>
      <p class="text-slate-500 text-sm mt-2">Sign in to access your farmer dashboard and AI advice</p>
    </div>

    <!-- Error Banner -->
    <div id="authErrorBanner" class="hidden mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>

    <!-- Loading State Indicator -->
    <div id="authLoadingBox" class="hidden text-center py-6">
      <div class="w-8 h-8 border-3 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mx-auto mb-3"></div>
      <p class="text-xs text-slate-500 font-semibold">Validating session with Supabase...</p>
    </div>

    <div id="authButtonsBox" class="space-y-4">
      <!-- Primary Google Sign-In Button -->
      <button id="btnGoogleSignIn" type="button" class="w-full flex items-center justify-center gap-3 px-5 py-3.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-bold shadow-sm transition transform hover:-translate-y-0.5 active:translate-y-0">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
        <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-3 text-slate-400 font-bold">Hackathon Demo Mode</span></div>
      </div>

      <!-- 1-Click Instant Demo Login for Hackathon Evaluation -->
      <button id="btnDemoBypass" type="button" class="w-full py-3.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-md transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
        <span>👨‍🌾</span>
        <span>1-Click Demo Login (Ramesh Gowda - Kolar)</span>
      </button>
    </div>

    <!-- Footer Back Link -->
    <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
      <a href="/" class="hover:text-emerald-700 font-semibold flex items-center gap-1 transition">
        <span>&larr;</span> Back to Home
      </a>
      <span class="text-slate-400">ICAR &amp; Sarvam AI Grounded</span>
    </div>
  </div>

  <script type="module">
    import { supabase, signInWithGoogle } from './js/supabaseClient.js';

    const urlParams = new URLSearchParams(window.location.search);
    const redirectTarget = urlParams.get('redirect') || '/app';

    // 1. Check if user already has an active session or is returning from Google OAuth
    async function handleAuthRedirect() {
      const loadingBox = document.getElementById('authLoadingBox');
      const buttonsBox = document.getElementById('authButtonsBox');

      loadingBox.classList.remove('hidden');
      buttonsBox.classList.add('hidden');

      try {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (session && session.user) {
          // Logged in via Supabase Google OAuth! Route to private portal
          window.location.replace(redirectTarget);
          return;
        }

        // Check if demo user flag exists in localStorage
        const demoUser = localStorage.getItem('kisansamvaad_demo_user');
        if (demoUser) {
          window.location.replace(redirectTarget);
          return;
        }
      } catch (err) {
        console.warn("Session check error:", err);
      } finally {
        loadingBox.classList.add('hidden');
        buttonsBox.classList.remove('hidden');
      }
    }
    handleAuthRedirect();

    // 2. Google OAuth Trigger
    document.getElementById('btnGoogleSignIn').addEventListener('click', async () => {
      const banner = document.getElementById('authErrorBanner');
      banner.classList.add('hidden');
      try {
        await signInWithGoogle(redirectTarget);
      } catch (err) {
        banner.textContent = err.message || 'Failed to initiate Google OAuth. Please verify Google Cloud setup.';
        banner.classList.remove('hidden');
      }
    });

    // 3. Demo Login Trigger (Guaranteed Instant Access for Judges)
    document.getElementById('btnDemoBypass').addEventListener('click', () => {
      localStorage.setItem('kisansamvaad_demo_user', JSON.stringify({
        id: "demo-farmer-001",
        name: "Ramesh Gowda",
        phone: "+91 98450 12345",
        location: "Kolar, Karnataka",
        crops: ["Tomato", "Cotton", "Beans", "Rice"],
        language: "kn-IN"
      }));
      window.location.replace(redirectTarget);
    });
  </script>

</body>
</html>
