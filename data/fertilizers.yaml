# KisanSamvaad - Commercial Fertilizer Specification and Price Registry
# Government of India statutory bag sizes and benchmark retail prices
# Note: Urea is strictly packaged in 45 kg bags (mandated by GoI since March 2018).
# Prices are demo subsidized retail defaults, configurable per state/district.

fertilizers:
  urea:
    id: "urea"
    name: "Neem Coated Urea"
    name_kn: "ಬೇವು ಲೇಪಿತ ಯೂರಿಯಾ"
    name_hi: "नीम लेपित यूरिया"
    name_ta: "வேப்பம் பூசப்பட்ட யூரியா"
    formula: "CO(NH2)2"
    bag_size_kg: 45.0  # Mandatory 45 kg bag as per Ministry of Chemicals & Fertilizers
    n_content_pct: 46.0
    p2o5_content_pct: 0.0
    k2o_content_pct: 0.0
    secondary_nutrients: []
    default_price_inr: 266.50
    price_updated_at: "2026-11-01"
    subsidized: true
    source: "Department of Fertilizers, Ministry of Chemicals & Fertilizers, GoI"
    verified: false  # TODO(verify): local mandi retail price verification

  dap:
    id: "dap"
